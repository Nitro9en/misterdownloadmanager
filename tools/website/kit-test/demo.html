<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteKit test page</title>
  <meta name="robots" content="noindex">
  <!-- The kit's test bench (tools/website/kit-test/e2e.mjs drives it). Served from the repository's
       root, so the kit and the screenshots come from where the site takes them. ?rtl, ?dark. -->
  <link rel="stylesheet" href="/website/kit/kit.css">
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #15171c; }
    :root[data-theme="dark"] { --bg: #12151c; --fg: #eef1f6; }
    /* overflow-x: hidden on the body, as many sites have: the lock must keep the sticky header in place. */
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; background: var(--bg); color: var(--fg); overflow-x: hidden; }
    header { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; padding: 12px 16px; background: #1f63d6; color: #fff; }
    .fixed-tag { position: fixed; inset-inline-end: 0; bottom: 0; padding: 4px 8px; background: #0c1a33; color: #fff; font-size: 12px; }
    main { max-width: 1000px; margin: 0 auto; padding: 16px; }
    /* Screenshots kept left to right on a right-to-left page: the viewer follows the page's dir. */
    .grid { direction: ltr; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .grid img { display: block; width: 100%; height: 110px; object-fit: cover; border-radius: 8px; }
    .grid .top img { object-position: top; }
    .prose img { max-width: 100%; height: auto; border-radius: 6px; }
    .tall { height: 1600px; }
    dialog p { margin: 0 0 12px; }
    .pad { padding: 20px; }
  </style>
  <script>
    if (/[?&]rtl/.test(location.search)) { document.documentElement.dir = "rtl"; document.documentElement.lang = "ar"; }
    if (/[?&]dark/.test(location.search)) document.documentElement.setAttribute("data-theme", "dark");
  </script>
  <script src="/website/kit/core.js" defer></script>
  <script src="/website/kit/modal.js" defer></script>
  <script src="/website/kit/lightbox.js" defer></script>
  <script>
    window.KIT_ERRORS = [];
    addEventListener("error", function (e) { KIT_ERRORS.push(String(e.message)); });
    addEventListener("DOMContentLoaded", function () {
      SiteKit.setStrings({ hint: "Click to zoom · drag to move" });
      SiteKit.lightbox.init({ auto: ".prose" });
    });
  </script>
</head>
<body>
  <header id="hdr"><b>SiteKit</b><span>test bench</span></header>
  <div class="fixed-tag" id="fixed">fixed</div>
  <main>
    <h1>Gallery</h1>
    <ul class="grid" id="gallery" role="list" style="list-style:none;padding:0">
      <li><a id="g1" href="/website/assets/screens/main-light.webp" data-lightbox="g"><img src="/website/assets/screens/main-light.webp" width="930" height="500" alt="Main window, light"></a></li>
      <li class="top"><a id="g2" href="/website/assets/screens/options-light.webp" data-lightbox="g"><img src="/website/assets/screens/options-light.webp" width="430" height="531" alt="Options, light"></a></li>
      <li><a id="g3" href="/website/assets/screens/torrent-dark.webp" data-lightbox="g"><img src="/website/assets/screens/torrent-dark.webp" width="546" height="448" alt="Torrent, dark"></a></li>
      <li><a id="g4" href="/website/assets/screens/scheduler-light.webp" data-lightbox="g"><img src="/website/assets/screens/scheduler-light.webp" width="651" height="530" alt="Scheduler, light"></a></li>
      <li><a id="g5" href="/kit-test-clip.webm" data-lightbox="g" data-width="640" data-height="360"><img src="/website/assets/screens/arabic-main.webp" width="930" height="500" alt="A short clip"></a></li>
    </ul>
    <h2>Article</h2>
    <article class="prose" id="prose">
      <p>Pictures in an article join a group by themselves.</p>
      <figure><img id="p1" src="/website/assets/screens/progress-light.webp" width="546" height="442" alt="Progress window"><figcaption><b>Progress</b> eight connections at once.</figcaption></figure>
      <p><img id="p2" src="/website/assets/screens/add-torrent-light.webp" width="600" height="485" alt="Add a torrent"></p>
      <p><a href="/elsewhere.html"><img id="p3" src="/website/assets/screens/video-light.webp" width="500" height="372" alt="A link to a page"></a></p>
      <p><img id="p4" src="/website/assets/screens/main-linux-light.webp" width="930" height="507" alt="Skipped" data-lightbox-skip></p>
    </article>
    <h2>Modals</h2>
    <p><button id="open-m1" data-modal-open="m1">Open a small modal</button>
       <button id="open-m3" data-modal-open="m3">Open a sheet</button>
       <button id="open-m4" data-modal-open="m4">Open one that only its button closes</button></p>
    <div class="tall"></div>
  </main>
  <dialog id="m1" class="kit-modal" data-size="sm" aria-labelledby="m1t">
    <div class="pad">
      <h2 id="m1t">Small</h2>
      <p>A modal. <button id="open-m2" data-modal-open="m2">Open another over it</button></p>
      <p data-lightbox><img id="m1img" src="/website/assets/screens/main-dark.webp" width="930" height="500" alt="Main window, dark" style="width:100%;height:auto"></p>
      <button id="close-m1" data-modal-close>Close</button>
    </div>
  </dialog>
  <dialog id="m2" class="kit-modal" data-size="lg" aria-labelledby="m2t">
    <form method="dialog" class="pad"><h2 id="m2t">Large</h2><p>Stacked over the first.</p><button id="close-m2" value="done">Done</button></form>
  </dialog>
  <dialog id="m3" class="kit-modal" data-size="sheet" aria-labelledby="m3t">
    <div class="pad"><h2 id="m3t">Sheet</h2><p>From the bottom on a phone.</p><button data-modal-close>Close</button></div>
  </dialog>
  <dialog id="m4" class="kit-modal" data-size="md" data-dismiss="" aria-labelledby="m4t">
    <div class="pad"><h2 id="m4t">Only the button</h2><p>Neither Escape nor the backdrop closes this one.</p><button id="close-m4" data-modal-close>Close</button></div>
  </dialog>
</body>
</html>
